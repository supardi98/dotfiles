# 🖲️ Waycorner Hot Corners Configuration for Niri

# [Kanan Atas / Top-Right] -> Noctalia Notification Center
[top_right]
locations = ["top_right"]
size = 12
command = ["noctalia", "msg", "panel-toggle", "control-center", "notifications"]
timeout_ms = 150

# [Tengah Atas / Top-Edge Center] -> Noctalia Media Control / Now Playing
# margin: lebar area pas di tengah (120px)
# size: tinggi area deteksi dari bibir atas (8px)
[top_center]
locations = ["top"]
size = 8
margin = 120
command = ["noctalia", "msg", "panel-toggle", "control-center", "media"]
timeout_ms = 200

