# 🖐️ Touchpad Gestures Configuration (libinput-gestures)

# --- 3 Fingers (Jendela Aktif) ---
# Cubit 3 Jari -> Lepaskan ke Floating
gesture pinch in 3 /home/supardi/Projects/dotfiles/dotconfig/niri/scripts/float-controller.sh float-active

# Rentangkan 3 Jari -> Kembalikan ke Tiling Rapi
gesture pinch out 3 /home/supardi/Projects/dotfiles/dotconfig/niri/scripts/float-controller.sh tile-active

# --- 4 Fingers (Seluruh Workspace) ---
# Cubit 4 Jari -> Lepaskan SEMUA jendela ke Floating
gesture pinch in 4 /home/supardi/Projects/dotfiles/dotconfig/niri/scripts/float-controller.sh float-all

# Rentangkan 4 Jari -> Kembalikan SEMUA jendela ke Tiling
gesture pinch out 4 /home/supardi/Projects/dotfiles/dotconfig/niri/scripts/float-controller.sh tile-all

# --- 4 Fingers Swipe ---
# 4 Jari Kiri -> Noctalia App Launcher
gesture swipe left 4 noctalia msg panel-toggle launcher

# 4 Jari Kanan -> Noctalia Clipboard History
gesture swipe right 4 noctalia msg panel-toggle clipboard

# --- 4 Fingers Tap / Hold ---
# 4 Jari Ketuk / Tahan Sebentar -> Cycle Window Mode: Full Width -> Fullscreen -> Normal
gesture hold on 4 /home/supardi/Projects/dotfiles/dotconfig/niri/scripts/window-mode-cycle.sh

