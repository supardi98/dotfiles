# 🖐️ Touchpad Gestures Configuration (libinput-gestures)

# 4 Fingers Swipe Down -> Noctalia App Launcher
gesture swipe down 4 noctalia msg panel-toggle launcher

# 4 Fingers Swipe Right -> Noctalia Clipboard History
gesture swipe right 4 noctalia msg panel-toggle clipboard

# 4 Fingers Swipe Left -> Noctalia Control Center
gesture swipe left 4 noctalia msg panel-toggle control-center
